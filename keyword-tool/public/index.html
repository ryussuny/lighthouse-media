<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🔍 키워드 검색량 조회</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>" />
<style>
  :root {
    --bg: #0f1226;
    --panel: #1a1e3a;
    --panel-2: #232850;
    --accent: #6c8cff;
    --accent-2: #a06bff;
    --text: #eef1ff;
    --muted: #9aa3c7;
    --chip: #2c3260;
    --series-1: #3987e5;   /* 추이 라인 (검증 완료) */
    --grid: rgba(255,255,255,0.08);
    --baseline: rgba(255,255,255,0.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #25305f 0%, var(--bg) 60%);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }
  header { text-align: center; margin-bottom: 26px; }
  header h1 { font-size: 1.85rem; margin: 0 0 6px; }
  header p { color: var(--muted); margin: 0; font-size: 0.95rem; }
  .card {
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  .searchbar { display: flex; gap: 10px; }
  .searchbar input {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 1.05rem;
    font-family: inherit;
  }
  .searchbar input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button {
    border: none; border-radius: 12px; padding: 12px 22px;
    font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    transition: transform .08s ease, opacity .2s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { margin-top: 12px; min-height: 20px; font-size: 0.9rem; color: var(--muted); }
  .err { color: #ff8b8b; }
  .badge {
    display: inline-block; font-size: 0.72rem; padding: 3px 9px; border-radius: 999px;
    background: var(--chip); color: var(--muted); margin-left: 8px; vertical-align: 2px;
  }
  .badge.live { color: #7ee2a8; }

  #results { display: none; margin-top: 24px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .tile {
    background: var(--panel); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px; padding: 16px 18px;
  }
  .tile .label { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
  .tile .value { font-size: 1.7rem; font-weight: 700; }
  .tile .sub { font-size: 0.78rem; color: var(--muted); margin-top: 4px; }

  .chart-card h2, .table-card h2 { font-size: 1.05rem; margin: 0 0 4px; }
  .chart-card .sub, .table-card .sub { color: var(--muted); font-size: 0.82rem; margin: 0 0 14px; }
  #chart { width: 100%; display: block; }
  #tooltip {
    position: absolute; pointer-events: none; display: none;
    background: #0b0e20; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 9px; padding: 8px 11px; font-size: 0.82rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 10; white-space: nowrap;
  }
  #tooltip .t-month { color: var(--muted); font-size: 0.75rem; margin-bottom: 2px; }
  #tooltip .t-val { font-weight: 700; }
  .chart-wrap { position: relative; }

  .table-card { margin-top: 22px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.06); }
  th { color: var(--muted); font-weight: 600; font-size: 0.8rem; }
  th:first-child, td:first-child { text-align: left; }
  td.num { font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; transition: background .12s; }
  tbody tr:hover { background: rgba(255,255,255,0.04); }
  .comp { font-size: 0.78rem; padding: 3px 9px; border-radius: 999px; background: var(--chip); }
  .comp[data-v="높음"] { color: #ff9d9d; }
  .comp[data-v="중간"] { color: #ffd27e; }
  .comp[data-v="낮음"] { color: #7ee2a8; }
  .hint { color: var(--muted); font-size: 0.8rem; margin-top: 10px; }
  @media (max-width: 560px) {
    th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔍 키워드 검색량 조회</h1>
    <p>키워드를 입력하면 월간 검색량, 12개월 추이, 연관 키워드와 경쟁도를 보여드립니다.</p>
  </header>

  <div class="card">
    <div class="searchbar">
      <input id="q" placeholder="예: 캠핑의자, 홈트레이닝, 제주도 여행" autocomplete="off" />
      <button id="go">조회</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="results">
    <div class="tiles" id="tiles"></div>

    <div class="card chart-card">
      <h2>최근 12개월 검색 추이 <span class="badge" id="trendBadge"></span></h2>
      <p class="sub">최대 검색 시점을 100으로 한 상대 지수</p>
      <div class="chart-wrap">
        <svg id="chart" viewBox="0 0 860 260" role="img" aria-label="월별 검색 추이 라인 차트"></svg>
        <div id="tooltip"></div>
      </div>
    </div>

    <div class="card table-card">
      <h2>연관 키워드 <span class="badge" id="statsBadge"></span></h2>
      <p class="sub">행을 클릭하면 해당 키워드를 조회합니다</p>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>키워드</th><th>PC</th><th>모바일</th><th>총 검색량</th><th>경쟁도</th></tr></thead>
          <tbody id="relBody"></tbody>
        </table>
      </div>
    </div>
    <div class="hint">💡 실데이터 연동: <code>.env</code>에 네이버 검색광고 API 키(검색량)와 데이터랩 API 키(추이)를 넣으면 데모 배지가 실데이터로 바뀝니다.</div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n >= 10000 ? (n/10000).toFixed(n >= 100000 ? 0 : 1) + "만" : n.toLocaleString("ko-KR");

  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function badge(el, engine) {
    const live = engine === "naver" || engine === "datalab";
    el.textContent = live ? "네이버 실데이터" : "데모 데이터";
    el.className = "badge" + (live ? " live" : "");
  }

  function renderTiles(s) {
    const items = [
      { label: "총 월간 검색량", value: fmt(s.total), sub: "PC + 모바일" },
      { label: "PC", value: fmt(s.pc), sub: Math.round(s.pc / s.total * 100) + "%" },
      { label: "모바일", value: fmt(s.mobile), sub: Math.round(s.mobile / s.total * 100) + "%" },
      { label: "광고 경쟁도", value: s.compIdx, sub: s.adDepth ? `평균 노출 광고 ${s.adDepth}개` : "" },
    ];
    $("tiles").innerHTML = items.map(t =>
      `<div class="tile"><div class="label">${t.label}</div><div class="value">${esc(t.value)}</div><div class="sub">${esc(t.sub)}</div></div>`
    ).join("");
  }

  // ── 라인 차트 (inline SVG, 크로스헤어 + 툴팁) ──────────────────────
  let chartPts = [];
  function renderChart(trend) {
    const W = 860, H = 260, padL = 44, padR = 20, padT = 16, padB = 34;
    const iw = W - padL - padR, ih = H - padT - padB;
    const n = trend.length;
    const x = (i) => padL + (i / (n - 1)) * iw;
    const y = (v) => padT + (1 - v / 100) * ih;
    chartPts = trend.map((d, i) => ({ cx: x(i), cy: y(d.ratio), ...d }));

    let g = "";
    // 가로 그리드 (0/25/50/75/100) — 눈에 띄지 않게
    for (const v of [0, 25, 50, 75, 100]) {
      g += `<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="${v === 0 ? "var(--baseline)" : "var(--grid)"}" stroke-width="1"/>`;
      g += `<text x="${padL-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
    }
    // x축 레이블 (격월)
    trend.forEach((d, i) => {
      if (i % 2 === 0) g += `<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.month.slice(2).replace("-", ".")}</text>`;
    });
    // 라인 (2px) + 면 채움 살짝
    const line = chartPts.map((p, i) => `${i ? "L" : "M"}${p.cx},${p.cy}`).join("");
    g += `<path d="${line} L${chartPts[n-1].cx},${y(0)} L${chartPts[0].cx},${y(0)} Z" fill="var(--series-1)" opacity="0.10"/>`;
    g += `<path d="${line}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    // 호버 요소
    g += `<line id="xhair" y1="${padT}" y2="${padT+ih}" stroke="rgba(255,255,255,0.25)" stroke-width="1" visibility="hidden"/>`;
    g += `<circle id="dot" r="5" fill="var(--series-1)" stroke="var(--panel)" stroke-width="2" visibility="hidden"/>`;
    g += `<rect id="hit" x="${padL}" y="${padT}" width="${iw}" height="${ih}" fill="transparent"/>`;
    $("chart").innerHTML = g;

    const svg = $("chart"), tip = $("tooltip"), xh = svg.querySelector("#xhair"), dot = svg.querySelector("#dot");
    svg.querySelector("#hit").addEventListener("mousemove", (e) => {
      const r = svg.getBoundingClientRect();
      const mx = (e.clientX - r.left) * (W / r.width);
      let best = chartPts[0];
      for (const p of chartPts) if (Math.abs(p.cx - mx) < Math.abs(best.cx - mx)) best = p;
      xh.setAttribute("x1", best.cx); xh.setAttribute("x2", best.cx); xh.setAttribute("visibility", "visible");
      dot.setAttribute("cx", best.cx); dot.setAttribute("cy", best.cy); dot.setAttribute("visibility", "visible");
      tip.style.display = "block";
      tip.innerHTML = `<div class="t-month">${best.month}</div><div class="t-val">지수 ${best.ratio}</div>`;
      const wrap = svg.parentElement.getBoundingClientRect();
      let tx = (best.cx / W) * r.width + 14;
      if (tx + tip.offsetWidth > wrap.width) tx -= tip.offsetWidth + 28;
      tip.style.left = tx + "px";
      tip.style.top = ((best.cy / H) * r.height - 20) + "px";
    });
    svg.querySelector("#hit").addEventListener("mouseleave", () => {
      tip.style.display = "none";
      xh.setAttribute("visibility", "hidden");
      dot.setAttribute("visibility", "hidden");
    });
  }

  function renderTable(related) {
    $("relBody").innerHTML = related.length
      ? related.map(k =>
          `<tr data-kw="${esc(k.keyword)}"><td>${esc(k.keyword)}</td><td class="num">${fmt(k.pc)}</td><td class="num">${fmt(k.mobile)}</td><td class="num"><b>${fmt(k.total)}</b></td><td><span class="comp" data-v="${esc(k.compIdx)}">${esc(k.compIdx)}</span></td></tr>`
        ).join("")
      : `<tr><td colspan="5" style="text-align:center;color:var(--muted)">연관 키워드가 없습니다</td></tr>`;
    for (const tr of $("relBody").querySelectorAll("tr[data-kw]")) {
      tr.addEventListener("click", () => { $("q").value = tr.dataset.kw; search(); });
    }
  }

  async function search() {
    const q = $("q").value.trim();
    if (!q) { $("status").innerHTML = '<span class="err">키워드를 입력하세요.</span>'; return; }
    $("go").disabled = true;
    $("status").textContent = "조회 중...";
    try {
      const r = await fetch("/api/keyword?q=" + encodeURIComponent(q));
      const data = await r.json();
      if (!r.ok) { $("status").innerHTML = `<span class="err">${esc(data.error || "오류")}</span>`; return; }
      renderTiles(data.self);
      renderChart(data.trend);
      renderTable(data.related);
      badge($("trendBadge"), data.engines.trend);
      badge($("statsBadge"), data.engines.stats);
      $("results").style.display = "block";
      $("status").textContent = `"${data.keyword}" 조회 완료 · 연관 키워드 ${data.related.length}개`;
      history.replaceState(null, "", "?q=" + encodeURIComponent(q));
    } catch (e) {
      $("status").innerHTML = `<span class="err">서버 연결 실패: ${esc(e.message)}</span>`;
    } finally {
      $("go").disabled = false;
    }
  }

  $("go").addEventListener("click", search);
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });

  const initQ = new URLSearchParams(location.search).get("q");
  if (initQ) { $("q").value = initQ; search(); }
</script>
</body>
</html>
